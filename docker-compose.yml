services:
  app:
    build: .
    container_name: personal-site
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/personal-site
      - DEV_USERNAME=${DEV_USERNAME}
      - DEV_PASSWORD=${DEV_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: personal-site-mongo
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
